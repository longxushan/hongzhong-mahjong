name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 首次运行时自动启用 Pages 并把构建源设为 GitHub Actions
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 站点发布单文件游戏 + 语音包目录（108 条台词 mp3），避免把文档/脚本等仓库内容暴露到线上
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r voice _site/voice
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
